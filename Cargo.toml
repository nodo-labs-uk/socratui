[package]
name = "socratik"
version = "0.1.0"
description = "A Socratic tutor in your terminal, with a skill map, spaced review and flashcards"
license = "MIT"
repository = "https://github.com/nodo-labs-uk/socratik"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
ratatui = "0.30.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
unicode-width = "0.2.3"
ureq = { version = "2", features = ["json"] }
