# Builds socratui when a version tag is pushed (git tag v0.1.0 && git push --tags)
# and attaches the binary to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          # No version in the name, so the latest release always has the same file.
          name="socratui-x86_64-linux"
          mkdir "$name"
          cp target/release/socratui README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" socratui-*.tar.gz socratui-*.tar.gz.sha256 \
            --title "socratui $GITHUB_REF_NAME" --generate-notes
